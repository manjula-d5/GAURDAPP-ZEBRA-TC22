[versions]
agp         = "8.7.2"
kotlin      = "1.9.25"
hilt        = "2.52"
ksp         = "1.9.25-1.0.20"
coreKtx     = "1.15.0"
lifecycle   = "2.8.7"
composeBom  = "2024.11.00"
navigation  = "2.8.4"
room        = "2.6.1"
retrofit    = "2.11.0"
okhttp      = "4.12.0"
work        = "2.10.0"
timber      = "5.0.1"
security    = "1.1.0-alpha06"
gson        = "2.11.0"
splash      = "1.0.1"
coroutines  = "1.9.0"
desugar     = "2.1.3"
camerax     = "1.3.4"
mlkit       = "17.3.0"
coil        = "2.7.0"

[libraries]
core-ktx            = { group = "androidx.core",             name = "core-ktx",                         version.ref = "coreKtx" }
lifecycle-runtime   = { group = "androidx.lifecycle",        name = "lifecycle-runtime-ktx",             version.ref = "lifecycle" }
lifecycle-viewmodel = { group = "androidx.lifecycle",        name = "lifecycle-viewmodel-compose",       version.ref = "lifecycle" }
splash              = { group = "androidx.core",             name = "core-splashscreen",                 version.ref = "splash" }

compose-bom         = { group = "androidx.compose",          name = "compose-bom",                      version.ref = "composeBom" }
compose-ui          = { group = "androidx.compose.ui",       name = "ui" }
compose-ui-tooling  = { group = "androidx.compose.ui",       name = "ui-tooling" }
compose-ui-preview  = { group = "androidx.compose.ui",       name = "ui-tooling-preview" }
compose-material3   = { group = "androidx.compose.material3",name = "material3" }
compose-activity    = { group = "androidx.activity",         name = "activity-compose",                 version = "1.9.3" }
compose-icons-ext   = { group = "androidx.compose.material", name = "material-icons-extended" }
navigation-compose  = { group = "androidx.navigation",       name = "navigation-compose",               version.ref = "navigation" }

hilt-android        = { group = "com.google.dagger",         name = "hilt-android",                     version.ref = "hilt" }
hilt-compiler       = { group = "com.google.dagger",         name = "hilt-android-compiler",            version.ref = "hilt" }
hilt-navigation     = { group = "androidx.hilt",             name = "hilt-navigation-compose",          version = "1.2.0" }
hilt-work           = { group = "androidx.hilt",             name = "hilt-work",                        version = "1.2.0" }
hilt-work-compiler  = { group = "androidx.hilt",             name = "hilt-compiler",                    version = "1.2.0" }

room-runtime        = { group = "androidx.room",             name = "room-runtime",                     version.ref = "room" }
room-ktx            = { group = "androidx.room",             name = "room-ktx",                         version.ref = "room" }
room-compiler       = { group = "androidx.room",             name = "room-compiler",                    version.ref = "room" }

retrofit            = { group = "com.squareup.retrofit2",    name = "retrofit",                         version.ref = "retrofit" }
retrofit-gson       = { group = "com.squareup.retrofit2",    name = "converter-gson",                   version.ref = "retrofit" }
okhttp-logging      = { group = "com.squareup.okhttp3",      name = "logging-interceptor",              version.ref = "okhttp" }
gson                = { group = "com.google.code.gson",      name = "gson",                             version.ref = "gson" }

coroutines-android  = { group = "org.jetbrains.kotlinx",    name = "kotlinx-coroutines-android",       version.ref = "coroutines" }
workmanager         = { group = "androidx.work",             name = "work-runtime-ktx",                 version.ref = "work" }
security-crypto     = { group = "androidx.security",        name = "security-crypto",                  version.ref = "security" }
timber              = { group = "com.jakewharton.timber",    name = "timber",                           version.ref = "timber" }
desugar-jdk-libs    = { group = "com.android.tools",        name = "desugar_jdk_libs",                 version.ref = "desugar" }

camerax-core        = { group = "androidx.camera",           name = "camera-core",                      version.ref = "camerax" }
camerax-camera2     = { group = "androidx.camera",           name = "camera-camera2",                   version.ref = "camerax" }
camerax-lifecycle   = { group = "androidx.camera",           name = "camera-lifecycle",                 version.ref = "camerax" }
camerax-view        = { group = "androidx.camera",           name = "camera-view",                      version.ref = "camerax" }
mlkit-barcode       = { group = "com.google.mlkit",         name = "barcode-scanning",                 version.ref = "mlkit" }
coil-compose        = { group = "io.coil-kt",               name = "coil-compose",                     version.ref = "coil" }

[plugins]
android-application = { id = "com.android.application",         version.ref = "agp" }
kotlin-android      = { id = "org.jetbrains.kotlin.android",    version.ref = "kotlin" }
hilt                = { id = "com.google.dagger.hilt.android",  version.ref = "hilt" }
ksp                 = { id = "com.google.devtools.ksp",         version.ref = "ksp" }
